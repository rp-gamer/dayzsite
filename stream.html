<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>PT Boxing — Stream Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{ --re:#bb2000; --bl:#1840bb; --go:#d4a800; --gb:#f0c000; }
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;width:1920px;height:200px;overflow:hidden;font-family:Oswald,sans-serif}
.pts{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}
.pt{position:absolute;down:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(220px) rotate(720deg);opacity:0}}
.bar{width:1920px;height:200px;display:flex;align-items:center;
  background:linear-gradient(180deg,rgba(6,7,6,0) 0%,rgba(6,7,6,.94) 22%,rgba(6,7,6,.98) 100%);
  padding:0 44px;position:relative}
.side-r{flex:1;display:flex;align-items:center;height:120px;
  background:linear-gradient(90deg,rgba(139,0,0,.24),transparent);
  padding:20px 32px 20px 22px;border-left:3px solid rgba(187,32,0,.85);border-radius:3px 0 0 3px}
.side-b{flex:1;display:flex;align-items:center;flex-direction:row-reverse;height:120px;position:relative;
  background:linear-gradient(270deg,rgba(0,30,120,.24),transparent);
  padding:20px 22px 20px 32px;border-right:3px solid rgba(24,64,187,.85);border-radius:0 3px 3px 0}
.fi{flex:1}.fi.rt{text-align:right}
.ctag{font-family:"Share Tech Mono",monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:7px}
.side-r .ctag{color:rgba(220,100,80,.85)}.side-b .ctag{color:rgba(80,130,230,.85)}
.fname{font-size:46px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff;line-height:1;text-shadow:0 2px 24px rgba(0,0,0,.9)}
.center{width:360px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 18px}
.clogo{width:36px;height:36px;object-fit:contain;opacity:.7;filter:drop-shadow(0 0 6px rgba(106,127,66,.5))}
.rndtag{font-family:"Share Tech Mono",monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:var(--go);background:rgba(212,168,0,.1);border:1px solid rgba(212,168,0,.3);border-radius:2px;padding:2px 12px}
.sbox{display:flex;align-items:center;gap:5px}
.sn{font-size:64px;font-weight:700;line-height:1;min-width:70px;text-align:center;transition:transform .25s}
.snr{color:var(--re);text-shadow:0 0 28px rgba(187,32,0,.75)}.snb{color:var(--bl);text-shadow:0 0 28px rgba(24,64,187,.75)}
.sdiv{font-size:32px;color:rgba(255,255,255,.15)}
.tmr{font-family:"Share Tech Mono",monospace;font-size:32px;letter-spacing:6px;color:var(--gb);
  text-shadow:0 0 20px rgba(212,168,0,.6);background:rgba(212,168,0,.07);border:1px solid rgba(212,168,0,.25);
  border-radius:2px;padding:4px 16px;min-width:130px;text-align:center;transition:all .3s}
.tmr.danger{color:#ff3300;border-color:rgba(255,51,0,.45);text-shadow:0 0 20px rgba(255,51,0,.7);animation:td .5s infinite}
@keyframes td{0%,100%{opacity:1}50%{opacity:.4}}
.rpips{display:flex;gap:7px}
.rp{width:28px;height:28px;border-radius:2px;border:1px solid rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;font-family:"Share Tech Mono",monospace;
  font-size:12px;color:rgba(255,255,255,.22);transition:all .4s}
.rp.act{border-color:var(--go);color:var(--go);background:rgba(212,168,0,.18);box-shadow:0 0 10px rgba(212,168,0,.35)}
.rp.dn{border-color:rgba(255,255,255,.38);background:rgba(255,255,255,.1);color:white}
.liveb{position:absolute;top:8px;right:10px;background:rgba(187,32,0,.88);border-radius:2px;
  padding:3px 10px;font-family:"Share Tech Mono",monospace;font-size:9px;letter-spacing:3px;
  color:white;animation:lp 2s infinite;display:none}
@keyframes lp{0%,100%{opacity:1}50%{opacity:.5}}
.wspl{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(6,7,6,.93);z-index:100;gap:14px;animation:wIn .5s ease}
.wspl.show{display:flex}
@keyframes wIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.wcb{font-family:"Share Tech Mono",monospace;font-size:14px;letter-spacing:5px;text-transform:uppercase;
  padding:8px 28px;border-radius:40px;border:2px solid}
.wcb.r{background:rgba(187,32,0,.3);border-color:var(--re);color:#ff4422}
.wcb.b{background:rgba(24,64,187,.3);border-color:var(--bl);color:#4499ff}
.wcb.d{background:rgba(212,168,0,.15);border-color:var(--go);color:var(--gb)}
.wlbl{font-family:"Share Tech Mono",monospace;font-size:15px;letter-spacing:7px;color:rgba(255,255,255,.4);text-transform:uppercase}
.wnm{font-family:Oswald,sans-serif;font-size:96px;font-weight:700;letter-spacing:4px;text-transform:uppercase;
  color:var(--gb);text-shadow:0 0 70px rgba(212,168,0,.65);animation:sh 2s ease infinite}
@keyframes sh{0%,100%{text-shadow:0 0 70px rgba(212,168,0,.65)}50%{text-shadow:0 0 120px rgba(212,168,0,1)}}
.cov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(6,7,6,.96);z-index:200}
.cov.show{display:flex}
.cico{font-size:76px;animation:flt 1.2s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.clbl{font-family:"Share Tech Mono",monospace;font-size:15px;letter-spacing:8px;color:rgba(255,255,255,.38);
  text-transform:uppercase;margin:16px 0 8px}
.cnm{font-family:Oswald,sans-serif;font-size:100px;font-weight:700;letter-spacing:4px;text-transform:uppercase;
  color:var(--gb);text-shadow:0 0 100px rgba(212,168,0,.75)}
@keyframes sfl{0%{transform:scale(1)}30%{transform:scale(1.4)}100%{transform:scale(1)}}.sf{animation:sfl .4s ease}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════
// STREAM OVERLAY
// Lê dados do Supabase em tempo real (mesmo que o index.html)
// Fallback automático para localStorage (uso OBS local)
//
// OBS: Browser Source → Local File: stream.html → 1920×200px
// ═══════════════════════════════════════════════════════════
const { createClient } = supabase;
let supa = null, realtimeCh = null;
let lsR=-1, lsB=-1, lastWin=null, lastChamp=null, wT=null;

function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function getM(S,id){
  if(!id||!S.bracket) return null;
  for(const r of S.bracket) for(const m of r.matches) if(m.id===id) return m;
  return null;
}

function render(S){
  if(!S) return;
  const m = getM(S, S.currentMatchId);
  document.getElementById('rN').textContent = m?.fighter1 || ' ';
  document.getElementById('bN').textContent = m?.fighter2 || ' ';
  document.getElementById('cRT').textContent = m?.roundName || ' ';
  const tv = document.getElementById('cT');
  tv.textContent = fmt(S.timerSec||0);
  tv.className = 'tmr'+(S.timerSec<=10&&S.timerSec>0?' danger':'');
  const sr=document.getElementById('sR'), sb=document.getElementById('sB');
  if(S.scoreRed!==lsR){ sr.textContent=S.scoreRed||0; sr.classList.remove('sf'); void sr.offsetWidth; sr.classList.add('sf'); lsR=S.scoreRed; }
  if(S.scoreBlue!==lsB){ sb.textContent=S.scoreBlue||0; sb.classList.remove('sf'); void sb.offsetWidth; sb.classList.add('sf'); lsB=S.scoreBlue; }
  for(let i=1;i<=3;i++){ const p=document.getElementById('rp'+i); p.className='rp'+(i<S.currentRound?' dn':i===S.currentRound?' act':''); }
  document.getElementById('liveB').style.display = S.timerRunning ? 'block' : 'none';
  if(m?.winner && m.winner!==lastWin){ lastWin=m.winner; showWin(m.winner,m.fighter1,m.fighter2); }
  if(S.champion && S.champion!==lastChamp){ lastChamp=S.champion; showChamp(S.champion); }
}

function showWin(name,f1,f2){
  clearTimeout(wT);
  const spl=document.getElementById('wSpl'), cb=document.getElementById('wCB'), nm=document.getElementById('wNm');
  cb.className='wcb '+(name===f1?'r':name===f2?'b':'d');
  cb.innerHTML = name===f1?'■ CANTO VERMELHO':name===f2?'■ CANTO AZUL':'⚖ EMPATE';
  nm.textContent=name; spl.classList.add('show'); confetti(50);
  wT=setTimeout(()=>spl.classList.remove('show'),7000);
}
function showChamp(name){
  document.getElementById('cNm').textContent=name;
  document.getElementById('cOv').classList.add('show');
  confetti(150);
}
function confetti(n){
  const c=document.getElementById('pts'); c.innerHTML='';
  const cols=['#bb2000','#1840bb','#d4a800','#ffffff','#4a5a2e','#f0c000'];
  for(let i=0;i<n;i++){
    const p=document.createElement('div'); p.className='pt';
    p.style.left=Math.random()*1920+'px';
    p.style.background=cols[Math.floor(Math.random()*cols.length)];
    const z=Math.random()*12+5; p.style.width=z+'px'; p.style.height=z+'px';
    p.style.borderRadius=Math.random()>.5?'50%':'2px';
    p.style.animationDuration=(Math.random()*2.5+1.5)+'s';
    p.style.animationDelay=(Math.random()*1.5)+'s';
    c.appendChild(p);
  }
  setTimeout(()=>c.innerHTML='',6000);
}

// Pollar localStorage a cada 300ms (para OBS local — admin e stream no mesmo PC)
function pollLocal(){
  const raw=localStorage.getItem('pt_state');
  if(raw) try{ render(JSON.parse(raw)); }catch(e){}
}

// Ligar ao Supabase Realtime (para GitHub Pages — browsers diferentes)
function initSupa(){
  const url=localStorage.getItem('pt_sb_url');
  const key=localStorage.getItem('pt_sb_key');
  if(!url||!key){ console.log('Stream: sem Supabase — a usar localStorage'); return; }
  try{
    supa = createClient(url, key);
    // Carregar estado inicial
    supa.from('boxing_state').select('data').eq('id','main').single()
      .then(({data,error})=>{ if(data?.data){ localStorage.setItem('pt_state',JSON.stringify(data.data)); render(data.data); } });
    // Subscrever updates em tempo real
    realtimeCh = supa.channel('stream-boxing')
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'boxing_state',filter:'id=eq.main'},
        payload=>{ const d=payload.new?.data; if(d){ localStorage.setItem('pt_state',JSON.stringify(d)); render(d); } })
      .subscribe();
    console.log('Stream: Supabase Realtime conectado ✔');
  }catch(e){ console.error('Stream: Supabase erro:',e); }
}

initSupa();
setInterval(pollLocal, 300); // sempre pollar local (OBS local use-case)
</script>
